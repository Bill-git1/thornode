{{ template "default-state.yaml" }}
---
{{ template "btc-eth-pool-state.yaml" }}
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/nodes
asserts:
  - .|length == 1
  - .[]|select(.node_address == "{{ addr_thor_dog }}")|.total_bond == "5000000000000"
---
type: tx-mimir
key: PauseOnSlashThreshold
value: 1
signer: {{ addr_thor_dog }}
---
type: create-blocks
count: 1
---
########################################################################################
# Unscheduled outbound without a memo should slash.
########################################################################################
type: tx-observed-out
signer: {{ addr_thor_dog }}
txs:
  - tx:
      id: "{{ observe_txid 1 }}"
      chain: BTC
      from_address: {{ addr_btc_dog }}
      to_address: {{ addr_btc_cat }}
      coins:
        - amount: "10000"
          asset: "BTC.BTC"
          decimals: 8
      gas:
        - amount: "1000"
          asset: "BTC.BTC"
      memo: ""
    block_height: 1
    finalise_height: 1
    observed_pub_key: {{ pubkey_dog }}
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/nodes
asserts:
  - .[]|select(.node_address == "{{ addr_thor_dog }}")|.total_bond|tonumber < 5000000000000
---
type: check
endpoint: http://localhost:1317/thorchain/block
asserts:
  - '[.txs[].result.events[]|select(.type == "slash")]|length > 0'
---
type: check
endpoint: http://localhost:1317/thorchain/mimir
asserts:
  - .HALTSIGNINGBTC > 0
  - .HALTBTCTRADING > 0
  - .HALTSIGNINGBTC == .HALTBTCTRADING
---
########################################################################################
# Unscheduled outbound with an outbound memo should also slash.
########################################################################################
type: tx-observed-out
signer: {{ addr_thor_dog }}
txs:
  - tx:
      id: "{{ observe_txid 2 }}"
      chain: BTC
      from_address: {{ addr_btc_dog }}
      to_address: {{ addr_btc_cat }}
      coins:
        - amount: "10000"
          asset: "BTC.BTC"
          decimals: 8
      gas:
        - amount: "1000"
          asset: "BTC.BTC"
      memo: "OUT:{{ observe_txid 99 }}"
    block_height: 2
    finalise_height: 2
    observed_pub_key: {{ pubkey_dog }}
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/block
asserts:
  - '[.txs[].result.events[]|select(.type == "slash")]|length > 0'
---
type: check
endpoint: http://localhost:1317/thorchain/mimir
asserts:
  - .HALTSIGNINGBTC > 0
  - .HALTBTCTRADING > 0
  - .HALTSIGNINGBTC == .HALTBTCTRADING
---
########################################################################################
# Create and observe a valid scheduled refund outbound.
########################################################################################
type: tx-observed-in
signer: {{ addr_thor_dog }}
txs:
  - tx:
      id: "{{ observe_txid 3 }}"
      chain: BTC
      from_address: {{ addr_btc_cat }}
      to_address: {{ addr_btc_dog }}
      coins:
        - amount: "1000000"
          asset: "BTC.BTC"
          decimals: 8
      gas:
        - amount: "10000"
          asset: "BTC.BTC"
      memo: "BAD"
    block_height: 3
    finalise_height: 3
    observed_pub_key: {{ pubkey_dog }}
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/queue/outbound
asserts:
  - .|length == 1
  - .[0].in_hash == "{{ observe_txid 3 }}"
  - .[0].coin.amount == "${REFUND_AMOUNT=993000}"
---
type: tx-observed-out
signer: {{ addr_thor_dog }}
txs:
  - tx:
      id: "{{ observe_txid 4 }}"
      chain: BTC
      from_address: {{ addr_btc_dog }}
      to_address: {{ addr_btc_cat }}
      coins:
        - amount: "${REFUND_AMOUNT}"
          asset: "BTC.BTC"
          decimals: 8
      gas:
        - amount: "1000"
          asset: "BTC.BTC"
      memo: "REFUND:{{ observe_txid 3 }}"
    block_height: 4
    finalise_height: 4
    observed_pub_key: {{ pubkey_dog }}
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/queue/outbound
asserts:
  - .|length == 0
---
########################################################################################
# A second outbound for the same scheduled item is a double spend and should slash.
########################################################################################
type: tx-observed-out
signer: {{ addr_thor_dog }}
txs:
  - tx:
      id: "{{ observe_txid 5 }}"
      chain: BTC
      from_address: {{ addr_btc_dog }}
      to_address: {{ addr_btc_cat }}
      coins:
        - amount: "${REFUND_AMOUNT}"
          asset: "BTC.BTC"
          decimals: 8
      gas:
        - amount: "1000"
          asset: "BTC.BTC"
      memo: "REFUND:{{ observe_txid 3 }}"
    block_height: 5
    finalise_height: 5
    observed_pub_key: {{ pubkey_dog }}
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/block
asserts:
  - '[.txs[].result.events[]|select(.type == "slash")]|length > 0'

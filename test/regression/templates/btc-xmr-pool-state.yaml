type: state
genesis:
  app_state:
    bank:
      balances:
        - address: {{ addr_module_asgard }}
          coins:
            - amount: "200000000000"
              denom: rune
    thorchain:
      liquidity_providers:
        - asset: BTC.BTC
          asset_address: {{ addr_btc_cat }}
          asset_deposit_value: "100000000"
          last_add_height: "1"
          pending_asset: "0"
          pending_rune: "0"
          rune_address: {{ addr_thor_cat }}
          rune_deposit_value: "100000000000"
          units: "100000000000"
        - asset: XMR.XMR
          asset_address: {{ addr_xmr_cat }}
          asset_deposit_value: "1000000000000"
          last_add_height: "1"
          pending_asset: "0"
          pending_rune: "0"
          rune_address: {{ addr_thor_cat }}
          rune_deposit_value: "100000000000"
          units: "100000000000"
      pools:
        - LP_units: "100000000000"
          asset: BTC.BTC
          balance_asset: "100000000"
          balance_rune: "100000000000"
          decimals: "8"
          pending_inbound_asset: "0"
          pending_inbound_rune: "0"
          status: Available
          synth_units: "0"
        - LP_units: "100000000000"
          asset: XMR.XMR
          balance_asset: "1000000000000"
          balance_rune: "100000000000"
          decimals: "12"
          pending_inbound_asset: "0"
          pending_inbound_rune: "0"
          status: Available
          synth_units: "0"
      network_fees:
        - chain: BTC
          transaction_fee_rate: "7"
          transaction_size: "1000"
        - chain: XMR
          transaction_fee_rate: "10000"
          transaction_size: "5000"
      vaults:
        - block_height: "0"
          chains:
            - THOR
            - XMR
          coins:
            - amount: "1000000000000"
              asset: XMR.XMR
              decimals: "12"
          inbound_tx_count: "1"
          membership:
            - {{ pubkey_dog }}
          pub_key: {{ pubkey_dog }}
          pub_key_eddsa: {{ pubkey_dog_eddsa }}
          pub_key_frost: {{ pubkey_dog_eddsa }}
          status: ActiveVault
          type: AsgardVault

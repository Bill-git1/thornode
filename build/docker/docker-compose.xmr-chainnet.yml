########################################################################################
# Private THORChain 2-of-3 cluster + real Monero mainnet (chainnet build)
#
# Usage:
#   docker compose -f docker-compose.xmr-chainnet.yml build --no-cache
#   docker compose -f docker-compose.xmr-chainnet.yml up -d
#   bash xmr-chainnet-post-deploy.sh
#
# Three validators (dog/cat/fox) with FROST threshold signing against a real
# monerod syncing Monero mainnet. Dog is genesis, cat and fox join via validator.sh.
#
# Tear down (preserve monerod volume):
#   docker compose -f docker-compose.xmr-chainnet.yml down
#   docker volume rm docker_thornode docker_thornode-cat docker_thornode-fox \
#     docker_bifrost docker_bifrost-cat docker_bifrost-fox \
#     docker_xmr-frost-data docker_xmr-frost-data-cat docker_xmr-frost-data-fox
#
# Required mimirs (set by xmr-chainnet-post-deploy.sh, NOT env vars):
#   P2PGateDisabled=1        - let cat/fox bifrosts peer before Active
#   MinimumNodesForBFT=2     - default is 4, we only have 3 nodes
#   DesiredValidatorSet=3    - match our node count
#   NumberOfNewNodesPerChurn=3 - churn all 3 in at once
#   ChurnInterval=10         - chainnet default is 43200 (3 days), too slow for testing
#   ChurnRetryInterval=10    - retry churn every 10 blocks
#   MinimumBondInRune=1      - prevent "low bond" churn-out noise
#
# Auth: bifrost <-> frost-signer uses a seed-derived bearer token.
# Both Go and Rust must be built from the same commit. Mismatched auth causes
# silent scan failure (txs=0 on every block). Always rebuild BOTH together.
########################################################################################

volumes:
  thornode: {}
  thornode-cat: {}
  thornode-fox: {}
  bifrost: {}
  bifrost-cat: {}
  bifrost-fox: {}
  monero-daemon: {}
  xmr-frost-data: {}
  xmr-frost-data-cat: {}
  xmr-frost-data-fox: {}

# Per-node signer seed phrases delivered as mounted files (SIGNER_SEED_PHRASE_FILE)
# rather than container env vars, matching how real nodes provision the secret.
# These are well-known public chainnet test mnemonics, not real secrets.
# WARNING: this committed-file pattern is for local dev ONLY. Never commit a real
# seed phrase or point a committed file at one on stagenet/mainnet/node-launcher --
# real seeds must come from a tmpfs mount that is never written to git or disk.
configs:
  seed-dog:
    file: ./chainnet-seeds/dog.txt
  seed-cat:
    file: ./chainnet-seeds/cat.txt
  seed-fox:
    file: ./chainnet-seeds/fox.txt

x-disabled-chains: &disabled-chains
  BIFROST_CHAINS_BTC_DISABLED: "true"
  BIFROST_CHAINS_BCH_DISABLED: "true"
  BIFROST_CHAINS_LTC_DISABLED: "true"
  BIFROST_CHAINS_DOGE_DISABLED: "true"
  BIFROST_CHAINS_ETH_DISABLED: "true"
  BIFROST_CHAINS_AVAX_DISABLED: "true"
  BIFROST_CHAINS_BSC_DISABLED: "true"
  BIFROST_CHAINS_BASE_DISABLED: "true"
  BIFROST_CHAINS_GAIA_DISABLED: "true"
  BIFROST_CHAINS_NOBLE_DISABLED: "true"
  BIFROST_CHAINS_SOL_DISABLED: "true"
  BIFROST_CHAINS_XRP_DISABLED: "true"
  BIFROST_CHAINS_TRON_DISABLED: "true"
  BIFROST_CHAINS_POL_DISABLED: "true"
  BIFROST_CHAINS_ZEC_DISABLED: "true"
  BIFROST_CHAINS_SUI_DISABLED: "true"
  BIFROST_CHAINS_ADA_DISABLED: "true"

x-thorchain-env: &thorchain-env
  NET: chainnet
  CHAIN_ID: thorchain
  SIGNER_NAME: thorchain
  SIGNER_PASSWD: password
  SIGNER_SEED_PHRASE_FILE: /run/thornode/seed_phrase
  THOR_COSMOS_GRPC_ENABLE: "true"
  THOR_COSMOS_EBIFROST_ADDRESS: "0.0.0.0:50051"
  THOR_BLOCK_TIME: "6s"
  PORT_RPC: "27147"
  PORT_API: "1317"
  THOR_SEED_NODES_ENDPOINT: ""
  FAUCET: "cthor1zf3gsk7edzwl9syyefvfhle37cjtql35layy8z"
  EXTRA_FUND_ACCOUNT_1: "cthor1uuds8pd92qnnq0udw0rpg0szpgcslc9p0cdl2t"
  EXTRA_FUND_ACCOUNT_2: "cthor13wrmhnh2qe98rjse30pl7u6jxszjjwl4pak8t6"
  <<: *disabled-chains

x-bifrost-env: &bifrost-env
  NET: chainnet
  CHAIN_ID: thorchain
  SIGNER_NAME: thorchain
  SIGNER_PASSWD: password
  SIGNER_SEED_PHRASE_FILE: /run/thornode/seed_phrase
  THOR_SEED_NODES_ENDPOINT: ""
  THOR_BLOCK_TIME: "6s"
  BLOCK_SCANNER_BACKOFF: "5s"
  BIFROST_METRICS_PPROF_ENABLED: "true"
  BIFROST_SIGNER_BACKUP_KEYSHARES: "true"
  BIFROST_SIGNER_AUTO_OBSERVE: "false"
  BIFROST_SIGNER_KEYGEN_TIMEOUT: "8s"
  BIFROST_SIGNER_FROST_KEYGEN_TIMEOUT: "300s"
  BIFROST_SIGNER_KEYSIGN_TIMEOUT: "8s"
  <<: *disabled-chains
  BIFROST_CHAINS_XMR_DISABLED: "false"
  BIFROST_CHAINS_XMR_RPC_HOST: "http://monero-daemon:18081"
  BIFROST_CHAINS_XMR_CHAIN_NETWORK: "mainnet"
  BIFROST_CHAINS_XMR_DISABLE_TLS: "true"

x-frost-env: &frost-env
  XMR_FROST_LISTEN_ADDR: "0.0.0.0:8283"
  XMR_FROST_DAEMON_URL: "http://monero-daemon:18081"
  XMR_FROST_DAEMON_DISABLE_TLS: "true"
  XMR_FROST_DATA_DIR: "/home/serai/xmr-frost"
  XMR_FROST_CHAIN_NETWORK: "chainnet"
  XMR_FROST_MAX_SIGN_SCAN_LAG_BLOCKS: "32"
  XMR_FROST_RATE_LIMIT_GLOBAL_RPS: "500"
  XMR_FROST_RATE_LIMIT_GLOBAL_BURST: "5000"
  XMR_FROST_RATE_LIMIT_PER_IP_RPS: "500"
  XMR_FROST_RATE_LIMIT_PER_IP_BURST: "5000"

x-frost-healthcheck: &frost-healthcheck
  test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8283'"]
  interval: 5s
  timeout: 5s
  retries: 30
  start_period: 10s

x-logging: &logging
  driver: "json-file"
  options:
    max-size: "256m"
    max-file: "3"

services:
  # ================================ Monero mainnet ================================

  monero-daemon:
    image: sethsimmons/simple-monerod:v0.18.3.4
    restart: unless-stopped
    command:
      - --rpc-bind-ip=0.0.0.0
      - --rpc-bind-port=18081
      - --confirm-external-bind
      - --restricted-rpc
      - --prune-blockchain
      - --sync-pruned-blocks
      - --bootstrap-daemon-address=nodes.hashvault.pro:18081
      - --log-level=0
    volumes:
      - monero-daemon:/home/monero/.bitmonero
    ports:
      - "18081:18081"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-sf",
          "-H",
          "Content-Type: application/json",
          "-d",
          '{"jsonrpc":"2.0","id":"0","method":"get_block_count"}',
          "http://localhost:18081/json_rpc",
        ]
      interval: 60s
      timeout: 10s
      retries: 9999
      start_period: 120s

  # ================================ FROST signers =================================

  xmr-frost-signer: &frost-signer
    image: ${XMR_FROST_SIGNER_IMAGE:-registry.gitlab.com/thorchain/devops/serai/xmr-frost-signer:16f06497@sha256:5224d4fc192ead39ab313b7f96282994204e895c0f06c8af65ed9dc7abe599f1}
    restart: unless-stopped
    user: root
    entrypoint:
      - /bin/sh
      - -c
      - >-
        chown -R serai:serai /home/serai/xmr-frost &&
        exec runuser -u serai -- /bin/sh -lc 'if [ -x /usr/local/bin/xmr-frost-signer ];
        then exec /usr/local/bin/xmr-frost-signer; elif [ -x /bin/service ]; then
        exec /bin/service; else echo >&2 "missing xmr-frost-signer entrypoint";
        exit 127; fi'
    depends_on:
      monero-daemon:
        condition: service_healthy
    environment:
      <<: *frost-env
      SIGNER_SEED_PHRASE: "dog dog dog dog dog dog dog dog dog dog dog dog dog dog dog dog dog dog dog dog dog dog dog fossil"
    volumes:
      - xmr-frost-data:/home/serai/xmr-frost
    ports:
      - "8283:8283"
    healthcheck: *frost-healthcheck
    logging: *logging

  xmr-frost-signer-cat:
    <<: *frost-signer
    environment:
      <<: *frost-env
      SIGNER_SEED_PHRASE: "cat cat cat cat cat cat cat cat cat cat cat cat cat cat cat cat cat cat cat cat cat cat cat crawl"
    volumes:
      - xmr-frost-data-cat:/home/serai/xmr-frost
    ports: []

  xmr-frost-signer-fox:
    <<: *frost-signer
    environment:
      <<: *frost-env
      SIGNER_SEED_PHRASE: "fox fox fox fox fox fox fox fox fox fox fox fox fox fox fox fox fox fox fox fox fox fox fox filter"
    volumes:
      - xmr-frost-data-fox:/home/serai/xmr-frost
    ports: []

  # ================================ THORNodes =====================================

  thornode:
    build:
      context: ../../
      dockerfile: ./build/docker/Dockerfile
      args:
        TAG: chainnet
    image: thornode:xmr-chainnet
    restart: unless-stopped
    hostname: thornode
    environment:
      <<: *thorchain-env
      SEED: thornode
    configs:
      - source: seed-dog
        target: /run/thornode/seed_phrase
    ports:
      - "27147:27147"
      - "1317:1317"
      - "50051:50051"
      - "9090:9090"
    volumes:
      - "../scripts:/docker/scripts"
      - thornode:/root/.thornode
    entrypoint: /docker/scripts/genesis.sh
    command: ["thornode", "start"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:27147/health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    logging: *logging

  thornode-cat:
    image: thornode:xmr-chainnet
    restart: unless-stopped
    hostname: thornode-cat
    depends_on:
      thornode:
        condition: service_healthy
    environment:
      <<: *thorchain-env
      PEER: thornode
      SEED: thornode-cat
      SEEDS: thornode,thornode-fox
      AUTO_BOND: "true"
    configs:
      - source: seed-cat
        target: /run/thornode/seed_phrase
    volumes:
      - "../scripts:/docker/scripts"
      - thornode-cat:/root/.thornode
    entrypoint: /docker/scripts/validator.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:27147/health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    logging: *logging

  thornode-fox:
    image: thornode:xmr-chainnet
    restart: unless-stopped
    hostname: thornode-fox
    depends_on:
      thornode:
        condition: service_healthy
    environment:
      <<: *thorchain-env
      PEER: thornode
      SEED: thornode-fox
      SEEDS: thornode,thornode-cat
      AUTO_BOND: "true"
    configs:
      - source: seed-fox
        target: /run/thornode/seed_phrase
    volumes:
      - "../scripts:/docker/scripts"
      - thornode-fox:/root/.thornode
    entrypoint: /docker/scripts/validator.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:27147/health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    logging: *logging

  # ================================ Bifrosts ======================================

  bifrost: &bifrost
    image: thornode:xmr-chainnet
    restart: unless-stopped
    depends_on:
      thornode:
        condition: service_healthy
      monero-daemon:
        condition: service_healthy
      xmr-frost-signer:
        condition: service_healthy
    environment:
      <<: *bifrost-env
      CHAIN_API: thornode:1317
      CHAIN_RPC: thornode:27147
      BIFROST_THORCHAIN_CHAIN_EBIFROST: thornode:50051
      BIFROST_CHAINS_XMR_SIGNER_ENDPOINT: "http://xmr-frost-signer:8283"
    configs:
      - source: seed-dog
        target: /run/thornode/seed_phrase
    volumes:
      - "../scripts:/docker/scripts"
      - bifrost:/var/data/bifrost
      - thornode:/root/.thornode
    entrypoint: /docker/scripts/bifrost.sh
    command: ["bifrost", "-p"]
    logging: *logging

  bifrost-cat:
    <<: *bifrost
    depends_on:
      thornode-cat:
        condition: service_healthy
      monero-daemon:
        condition: service_healthy
      xmr-frost-signer-cat:
        condition: service_healthy
    environment:
      <<: *bifrost-env
      PEER: bifrost
      CHAIN_API: thornode-cat:1317
      CHAIN_RPC: thornode-cat:27147
      BIFROST_THORCHAIN_CHAIN_EBIFROST: thornode-cat:50051
      BIFROST_CHAINS_XMR_SIGNER_ENDPOINT: "http://xmr-frost-signer-cat:8283"
    configs:
      - source: seed-cat
        target: /run/thornode/seed_phrase
    volumes:
      - "../scripts:/docker/scripts"
      - bifrost-cat:/var/data/bifrost
      - thornode-cat:/root/.thornode
    command: ["bifrost"]

  bifrost-fox:
    <<: *bifrost
    depends_on:
      thornode-fox:
        condition: service_healthy
      monero-daemon:
        condition: service_healthy
      xmr-frost-signer-fox:
        condition: service_healthy
    environment:
      <<: *bifrost-env
      PEER: bifrost
      CHAIN_API: thornode-fox:1317
      CHAIN_RPC: thornode-fox:27147
      BIFROST_THORCHAIN_CHAIN_EBIFROST: thornode-fox:50051
      BIFROST_CHAINS_XMR_SIGNER_ENDPOINT: "http://xmr-frost-signer-fox:8283"
    configs:
      - source: seed-fox
        target: /run/thornode/seed_phrase
    volumes:
      - "../scripts:/docker/scripts"
      - bifrost-fox:/var/data/bifrost
      - thornode-fox:/root/.thornode
    command: ["bifrost"]

  # ------------------------------ xmr-frost-signer ------------------------------

  xmr-frost-signer: &xmr-frost-signer
    profiles:
      - mocknet
      - mocknet-cluster
    image: ${XMR_FROST_SIGNER_IMAGE:-registry.gitlab.com/thorchain/devops/serai/xmr-frost-signer@sha256:49752e667970026bba9c8efe4119530668e5f1f53c6a87284e7106a6f89d41a5}
    restart: unless-stopped
    user: root
    entrypoint:
      - /bin/sh
      - -c
      - >-
        chown -R serai:serai /home/serai/xmr-frost &&
        exec runuser -u serai -- /bin/sh -lc 'if [ -x /usr/local/bin/xmr-frost-signer ];
        then exec /usr/local/bin/xmr-frost-signer; elif [ -x /bin/service ]; then
        exec /bin/service; else echo >&2 "missing xmr-frost-signer entrypoint";
        exit 127; fi'
    depends_on:
      monero-daemon:
        condition: service_healthy
    environment:
      XMR_FROST_LISTEN_ADDR: "0.0.0.0:8283"
      XMR_FROST_DAEMON_URL: "http://monero-daemon:18081"
      XMR_FROST_DATA_DIR: "/home/serai/xmr-frost"
      XMR_FROST_CHAIN_NETWORK: "mocknet"
      XMR_FROST_MAX_SIGN_SCAN_LAG_BLOCKS: "32"
      XMR_FROST_RATE_LIMIT_GLOBAL_RPS: "500"
      XMR_FROST_RATE_LIMIT_GLOBAL_BURST: "5000"
      XMR_FROST_RATE_LIMIT_PER_IP_RPS: "500"
      XMR_FROST_RATE_LIMIT_PER_IP_BURST: "5000"
      SIGNER_SEED_PHRASE: "dog dog dog dog dog dog dog dog dog dog dog dog dog dog dog dog dog dog dog dog dog dog dog fossil"
      XMR_FROST_AUTH_BEARER: "${XMR_FROST_AUTH_BEARER:-xmr-frost-mocknet-token}"
    volumes:
      - xmr-frost-data:/home/serai/xmr-frost
    ports:
      - 8283:8283
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8283'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  xmr-frost-signer-cat:
    <<: *xmr-frost-signer
    profiles:
      - mocknet-cluster
    volumes:
      - xmr-frost-data-cat:/home/serai/xmr-frost
    ports:
      - 8285:8283 # host-side simulation readiness probe

  xmr-frost-signer-fox:
    <<: *xmr-frost-signer
    profiles:
      - mocknet-cluster
    volumes:
      - xmr-frost-data-fox:/home/serai/xmr-frost
    ports:
      - 8286:8283 # host-side simulation readiness probe

  xmr-frost-signer-pig:
    <<: *xmr-frost-signer
    profiles:
      - mocknet-cluster
    volumes:
      - xmr-frost-data-pig:/home/serai/xmr-frost
    ports:
      - 8287:8283 # host-side simulation readiness probe

  xmr-sim-helper:
    profiles:
      - mocknet
      - mocknet-cluster
    # Keep simulation faucet/balance behavior independent from signer image upgrades.
    image: ${XMR_SIM_HELPER_IMAGE:-registry.gitlab.com/thorchain/devops/serai/xmr-frost-signer@sha256:3f9c6b66a11e175741b914e401c09d0a048d833ca9a45000dd3d0bba4a659553}

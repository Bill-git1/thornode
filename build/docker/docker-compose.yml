        chown -R serai:serai /home/serai/xmr-sim &&
        exec runuser -u serai -- /bin/sh -lc 'if [ -x /usr/local/bin/xmr-frost-signer ];
        then exec /usr/local/bin/xmr-frost-signer; elif [ -x /bin/service ]; then

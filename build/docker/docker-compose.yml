    environment:
      XMR_FROST_LISTEN_ADDR: "0.0.0.0:8284"
      XMR_FROST_DAEMON_URL: "http://monero-daemon:18081"
      XMR_FROST_DATA_DIR: "/home/serai/xmr-sim"
      XMR_FROST_CHAIN_NETWORK: "mocknet"
      XMR_FROST_MAX_SIGN_SCAN_LAG_BLOCKS: "32"
      XMR_FROST_RATE_LIMIT_GLOBAL_RPS: "500"
      XMR_FROST_RATE_LIMIT_GLOBAL_BURST: "5000"
      XMR_FROST_RATE_LIMIT_PER_IP_RPS: "500"
      XMR_FROST_RATE_LIMIT_PER_IP_BURST: "5000"
      SIGNER_SEED_PHRASE: "dog dog dog dog dog dog dog dog dog dog dog dog dog dog dog dog dog dog dog dog dog dog dog fossil"
      XMR_FROST_AUTH_BEARER: "${XMR_SIM_HELPER_AUTH_BEARER:-xmr-sim-helper-mocknet-token}"
      XMR_SIM_HELPER_ENABLED: "true"
      XMR_SIM_HELPER_WALLET_RPC_URL: "http://monero-wallet-rpc:18082"
    volumes:
      - xmr-sim-data:/home/serai/xmr-sim
    ports:
      - 8284:8284
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8284'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s


  # ------------------------------ avalanche ------------------------------

  avalanche:
    profiles:
      - mocknet
      - mocknet-cluster
    restart: unless-stopped
    image: registry.gitlab.com/thorchain/devops/node-launcher:avalanche-daemon-1.14.2
    volumes:
      - "./mocknet/avax:/mocknet"
    command:
      - ./avalanchego
      - --sybil-protection-enabled=false
      - --network-id=local
      - --http-host=0.0.0.0
      - --chain-config-dir=/mocknet/configs
      - --http-allowed-hosts=*
      - --system-tracker-disk-required-available-space-percentage=0
      - --system-tracker-disk-warning-available-space-percentage=0
    ports:
      - 9650:9650
    environment:
      RPC_PORT: "9650"

  # ------------------------------ tron ------------------------------
  # The fullnode must wait for the supernode to be healthy before starting.
  # Starting the fullnode too early can trigger DUPLICATE_PEER / seed resolution
  # races that leave it stuck at block 0 with no peers for the rest of the run.
  # Waiting for several produced blocks and seeding via the stable service alias
  # makes tron bootstrap deterministic in simulation.

  tron-supernode:
    profiles:
      - mocknet
      - mocknet-cluster
    restart: unless-stopped
    image: registry.gitlab.com/thorchain/devops/node-launcher:tron-daemon-4.8.1
    entrypoint: /mocknet/tron-entrypoint.sh
    volumes:
      - "./mocknet:/mocknet"
    environment:
      TRON_NODE_TYPE: mocknet-supernode
    healthcheck:
      # Wait for the supernode to produce several blocks before fullnode
      # connects. On slower local Docker hosts, especially under amd64
      # emulation, block production can lag long enough that a block-10 check
      # trips false negatives even though the node is healthy and advancing.
      test:
        [
          "CMD",
          "curl",
          "-sf",
          "-X",
          "POST",
          "-H",
          "Content-Type: application/json",
          "-d",
          '{"num":5}',
          "http://localhost:8090/wallet/getblockbynum",
        ]
      interval: 3s
      timeout: 5s
      retries: 120
      start_period: 20s

  tron-fullnode:
    profiles:
      - mocknet
      - mocknet-cluster
    restart: unless-stopped
    image: registry.gitlab.com/thorchain/devops/node-launcher:tron-daemon-4.8.1
    entrypoint: /mocknet/tron-entrypoint.sh
    depends_on:
      tron-supernode:
        condition: service_healthy
    links:
      - tron-supernode:supernode
    volumes:
      - "./mocknet:/mocknet"
    ports:
      - "8090:8090"
      - "8091:8091"
    environment:
      TRON_NODE_TYPE: mocknet-fullnode
      TRON_SEED_NODE: tron-supernode:18888
    healthcheck:
      # The simulator signs TRON txs with wall-clock timestamps, but TRON sets tx
      # expiration from the fullnode's latest block. Require a fresh fullnode tip
      # and an active peer so mocknet cannot start when TRON txs will be stale or
      # accepted locally without propagating to the block producer.
      test:
        - CMD-SHELL
        - >
          ts=$$(curl -sf localhost:8090/wallet/getnowblock |
          jq -er '.block_header.raw_data.timestamp') &&
          peers=$$(curl -sf localhost:8090/wallet/getnodeinfo |
          jq -er '.currentConnectCount') &&
          age=$$(( $$(date +%s) * 1000 - ts )) &&
          [ $$age -ge 0 ] &&
          [ $$age -lt 30000 ] &&
          [ $$peers -gt 0 ]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 10s

  # ------------------------------ solana ------------------------------

  solana:

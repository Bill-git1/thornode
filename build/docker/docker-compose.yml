      --http.addr=0.0.0.0 
      --http.corsdomain="*" 
      --http.vhosts="*"
      --nodiscover 
      --miner.etherbase=0x8db97C7cEcE249c2b98bDC0226Cc4C2A57BF52FC

  # ------------------------------ zcash ------------------------------

  zcash:
    profiles:

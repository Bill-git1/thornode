    volumes:
      - monero-daemon:/var/lib/monero
    ports:
      - 18081:18081
      - 18080:18080
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-sf",
          "-H",
          "Content-Type: application/json",
          "-d",
          '{"jsonrpc":"2.0","id":"0","method":"get_block_count"}',
          "http://localhost:18081/json_rpc",
